# Single source of truth for the Android app's version.
#
# versionCode must strictly increase on every upload to Google Play. Play
# remembers every code you have ever published: one cannot be reused, and it
# cannot be lowered. That is why this is a committed counter rather than
# something derived from git — a rebase or a squash would make a commit count
# go backwards, and the damage is not recoverable.
#
# Bump with: scripts/bump-version.sh
versionCode=2
versionName=0.1.1
