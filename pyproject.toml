[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerialpod"
version = "0.1.0"
description = "A desktop podcast player that syncs with gpodder.net — an AntennaPod companion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.7",
    "feedparser>=6",
    "requests>=2.32",
    "dbus-fast>=2",
    "platformdirs",
    "secretstorage",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
aerialpod = "aerialpod.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aerialpod"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# dbus-fast requires D-Bus signature strings ("as", "a{sv}", "x") as annotations
"src/aerialpod/mpris/service.py" = ["F722", "F821"]
